# Operation: publish
name: publish
description: >
  Generate tags/tags.json from per-facet YAML files and abbrev.yaml.
  This JSON file is the single source of truth for external consumers.
  Contains complete tag metadata, abbreviation registry, and version info.

input:
  version:
    type: string
    required: false
    description: >
      Semantic version to embed in the output. If omitted, reads from
      protocol.yaml version field.

output:
  output_file:
    type: string
    description: Path to the generated tags/tags.json.
  tag_count:
    type: integer
    description: Total number of tags in the published JSON.
  updated_at:
    type: string
    description: ISO 8601 timestamp of publication.

preconditions:
  - id: FACET_FILES_EXIST
    rule: "At least one per-facet file MUST exist."

postconditions:
  - "tags/tags.json is written with complete vocabulary data."
  - "JSON contains: version, updated_at, facets, tags (full metadata), abbrevs, tag_count."
  - "Tags are sorted deterministically by facet then tag string."

errors:
  - code: NO_FACET_FILES
    message: "No per-facet files found. Nothing to publish."

side_effects:
  - "Overwrites tags/tags.json."
